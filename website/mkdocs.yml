site_name: Gazer
site_url: https://adamroden.github.io/Gazer/
site_description: Gaze-driven AAC and system input for Windows
repo_url: https://github.com/AdamRoden/Gazer
repo_name: AdamRoden/Gazer
edit_uri: edit/master/website/docs/
copyright: GPL-3.0. Gazer is free software.

docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  logo: assets/wordmark.png
  favicon: assets/favicon.png
  palette:
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.action.view
    - content.code.copy
    - toc.follow

plugins:
  - search

hooks:
  - hooks.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AdamRoden/Gazer

nav:
  - Home: index.md
  - Install: install.md
  - Using Gazer:
      - Dwell: dwell.md
      - Shell: shell.md
      - Typing: typing.md
      - Mouse: mouse.md
      - Assist: assist.md
      - Speech: speech.md
      - Settings: settings.md
  - Page editor: editor.md
  - Authoring pages: authoring.md
  - Reference:
      - Commands: reference/commands.md

name: Windows

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.11.1 MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.1"
          host: windows
          target: desktop
          arch: win64_mingw
          # qtbase supplies Core, Gui, Widgets, OpenGL, Network, Test.
          archives: qtbase qtdeclarative qtsvg qtmultimedia qttools
          tools: tools_mingw1310
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $gxx = (Get-Command g++).Source
          $gcc = (Get-Command gcc).Source
          # Headers under third_party/ are enough. CI does not install Tobii
          # hardware or tobii_stream_engine.dll. GAZER_USE_TOBII=OFF builds
          # the mouse tracker only.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$gcc" `
            -DCMAKE_CXX_COMPILER="$gxx" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DGAZER_USE_TOBII=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --target Gazer GazerPageTests GazerDwellTests GazerSpeechTests GazerPredictTests

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure --output-log build/ctest.log --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          if-no-files-found: warn
          path: |
            build/ctest.log
            build/Testing/**
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt

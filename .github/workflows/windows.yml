name: Windows

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # aqtinstall 3.3.0 is the newest release on PyPI. It still looks for the
      # pre-6.11 nested path qt6_611x/qt6_611x/Updates.xml, which Qt no longer
      # publishes. The layout fix is only on unreleased aqt git, so CI pins
      # 6.10.3 win64_mingw, the newest desktop MinGW kit that 3.3.0 can fetch.
      # Local builds can still use 6.11.1.
      - name: Install Qt 6.10.3 MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.3"
          host: windows
          target: desktop
          arch: win64_mingw
          # qtmultimedia is an add-on module, not a qtbase archive. aqt ignores
          # an archives name that is not in a selected package, so listing it
          # only under archives never downloads it. --archives also filters
          # extra modules: modules without qtmultimedia in archives drops it.
          modules: qtmultimedia
          archives: qtbase qtdeclarative qtsvg qtmultimedia qttools
          tools: tools_mingw1310
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          $gxx = (Get-Command g++).Source
          $gcc = (Get-Command gcc).Source
          # Headers under third_party/ are enough. CI does not install Tobii
          # hardware or tobii_stream_engine.dll. GAZER_USE_TOBII=OFF builds
          # the mouse tracker only.
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER="$gcc" `
            -DCMAKE_CXX_COMPILER="$gxx" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DGAZER_USE_TOBII=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --target Gazer GazerPageTests GazerDwellTests GazerSpeechTests GazerPredictTests

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure --output-log build/ctest.log --no-tests=error
          $code = $LASTEXITCODE
          $suite = "build/GazerPageTests-suites.txt"
          if (Test-Path $suite) {
            Write-Host "---- GazerPageTests suites ----"
            Get-Content $suite
          }
          if ($code -ne 0) { exit $code }

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          if-no-files-found: warn
          path: |
            build/ctest.log
            build/GazerPageTests-suites.txt
            build/Testing/**
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
